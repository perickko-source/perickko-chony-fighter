<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CHONY GAMEBOY - Street Fighter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            overflow: hidden;
            background: #b7b5b8;
            font-family: 'Arial Black', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            height: 100vh;
        }

        #consola-wrapper {
            position: relative;
            width: 572px;
            height: 1024px;
            transform-origin: center center;
        }

        #consola {
            position: relative;
            width: 572px;
            height: 1024px;
        }

        #consola-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #pantalla-juego {
            position: absolute;
            top: 58px;
            left: 24px;
            width: 525px;
            height: 408px;
            z-index: 2;
            overflow: hidden;
            background: #000;
        }

        #juego {
            position: relative;
            width: 100%;
            height: 100%;
            /* FONDO CON PARALLAX - La imagen se ajusta en altura */
            background-image: url('escenario.png');
            background-size: auto 100%;
            background-position: center bottom;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        /* Capa de oscurecimiento sutil para que los personajes destaquen */
        #juego::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.2) 100%);
            z-index: 1;
            pointer-events: none;
        }

        #hud {
            position: absolute;
            top: 5px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            z-index: 100;
        }

        .barra-vida-container {
            width: 35%;
            height: 20px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #fff;
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .barra-vida {
            height: 100%;
            background: linear-gradient(to bottom, #ff0, #f00);
            transition: width 0.3s;
        }

        .nombre-luchador {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 10px;
            font-weight: bold;
            text-shadow: 1px 1px #000;
            z-index: 10;
            white-space: nowrap;
        }

        #timer-container { text-align: center; }

        #timer {
            width: 50px;
            height: 30px;
            background: rgba(0,0,0,0.8);
            border: 2px solid #fff;
            color: #ff0;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
        }

        #round-info {
            color: #0f0;
            font-size: 10px;
            margin-top: 2px;
            text-shadow: 1px 1px #000;
        }

        #marcador {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 3px;
        }

        .victoria-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #333;
            border: 1px solid #666;
        }

        .victoria-dot.ganada {
            background: #0f0;
            border-color: #0f0;
            box-shadow: 0 0 5px #0f0;
        }

        /* Personajes en combate - ajustados para pisar el suelo */
        .luchador {
            position: absolute;
            bottom: 5%;
            width: 110px;
            height: 165px;
            z-index: 50;
        }

        .luchador canvas {
            width: 100%;
            height: 100%;
        }

        .efecto-golpe {
            position: absolute;
            font-size: 30px;
            font-weight: bold;
            color: #ff0;
            text-shadow: 2px 2px #f00;
            animation: golpeAnim 0.5s forwards;
            z-index: 200;
            pointer-events: none;
        }

        @keyframes golpeAnim {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.5) rotate(180deg); }
            100% { transform: scale(2) rotate(360deg); opacity: 0; }
        }

        .pantalla {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .pantalla h1 {
            font-size: 24px;
            color: #ff0;
            text-shadow: 2px 2px #f00;
            margin-bottom: 15px;
            text-align: center;
        }

        .pantalla h2 {
            font-size: 16px;
            color: #fff;
            margin-bottom: 10px;
        }

        .selector-personajes {
            display: flex;
            gap: 10px;
            margin: 10px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .personaje-opcion {
            text-align: center;
            padding: 8px;
            border: 2px solid #555;
            border-radius: 5px;
            transition: all 0.2s;
            background: rgba(255,255,255,0.1);
        }

        .personaje-opcion.seleccionado {
            border: 3px solid #ff0;
            background: rgba(255,255,0,0.25);
            box-shadow: 0 0 15px rgba(255,255,0,0.6);
            transform: scale(1.05);
        }

        .personaje-opcion img {
            height: 110px;
            object-fit: contain;
        }

        .personaje-opcion h3 {
            color: #fff;
            font-size: 10px;
            margin: 5px 0;
        }

        .stats {
            color: #aaa;
            font-size: 8px;
            line-height: 1.3;
        }

        .stats span { color: #0f0; }

        .btn-juego {
            padding: 8px 20px;
            font-size: 14px;
            background: #ff0;
            color: #000;
            border: 3px solid #555;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Arial Black', sans-serif;
            font-weight: bold;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .btn-juego.seleccionado {
            border-color: #ff0;
            background: #fff;
            box-shadow: 0 0 15px rgba(255,255,0,0.8);
            transform: scale(1.1);
        }

        .oculto { display: none !important; }

        #anuncio {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            color: #ff0;
            text-shadow: 3px 3px #f00, -1px -1px #000, 1px -1px #000, -1px 1px #000, 1px 1px #000;
            z-index: 500;
            animation: anuncioAnim 2s forwards;
            pointer-events: none;
        }

        @keyframes anuncioAnim {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        }

        #pantalla-round {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 900;
        }

        #pantalla-round.visible { display: flex; }

        #pantalla-round h2 {
            font-size: 28px;
            color: #ff0;
            text-shadow: 2px 2px #f00;
            margin-bottom: 10px;
        }

        #pantalla-round p {
            font-size: 14px;
            color: #fff;
            margin-bottom: 15px;
            text-align: center;
            white-space: pre-line;
        }

        #pantalla-final h1 { font-size: 32px; }

        #resultado-final {
            font-size: 16px;
            color: #fff;
            margin: 10px 0;
            text-align: center;
        }

        .boton-tactil {
            position: absolute;
            z-index: 1000;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .boton-tactil:active { opacity: 0.3; }

        #btn-up { top: 586px; left: 113px; width: 70px; height: 70px; }
        #btn-down { top: 733px; left: 117px; width: 70px; height: 70px; }
        #btn-left { top: 657px; left: 43px; width: 70px; height: 70px; }
        #btn-right { top: 657px; left: 183px; width: 70px; height: 70px; }
        #btn-x { top: 585px; left: 392px; width: 75px; height: 75px; }
        #btn-y { top: 661px; left: 321px; width: 75px; height: 75px; }
        #btn-a { top: 660px; left: 465px; width: 75px; height: 75px; }
        #btn-b { top: 734px; left: 395px; width: 75px; height: 75px; }
        #btn-select { top: 875px; left: 209px; width: 85px; height: 45px; }
        #btn-start { top: 874px; left: 298px; width: 85px; height: 45px; }

        .boton-tactil.activo { opacity: 0.3; }

        #modo-indicador {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            color: #0f0;
            font-size: 9px;
            background: rgba(0,0,0,0.7);
            padding: 2px 8px;
            border-radius: 3px;
            z-index: 100;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="consola-wrapper">
        <div id="consola">
            <img id="consola-bg" src="chony-gameboy.png" alt="CHONY GAMEBOY">

            <div id="pantalla-juego">
                <div id="juego">
                    <div id="modo-indicador">MENÚ: Elige personaje</div>

                    <div id="hud" class="oculto">
                        <div class="barra-vida-container">
                            <div class="barra-vida" id="vida-jugador" style="width: 100%;"></div>
                            <div class="nombre-luchador" id="nombre-jugador">JUGADOR</div>
                        </div>
                        <div id="timer-container">
                            <div id="timer">60</div>
                            <div id="round-info">Round 1/3</div>
                            <div id="marcador">
                                <div class="victoria-dot" id="v-j1"></div>
                                <div class="victoria-dot" id="v-j2"></div>
                                <div class="victoria-dot" id="v-j3"></div>
                            </div>
                        </div>
                        <div class="barra-vida-container">
                            <div class="barra-vida" id="vida-rival" style="width: 100%;"></div>
                            <div class="nombre-luchador" id="nombre-rival">RIVAL</div>
                        </div>
                    </div>

                    <div id="jugador" class="luchador oculto"><canvas></canvas></div>
                    <div id="rival" class="luchador oculto"><canvas></canvas></div>

                    <div id="pantalla-round">
                        <h2 id="round-titulo">¡ROUND 2!</h2>
                        <p id="round-mensaje">Prepárate</p>
                        <button class="btn-juego seleccionado" id="btn-continuar">CONTINUAR</button>
                    </div>

                    <div id="pantalla-inicio" class="pantalla">
                        <h1>CHONY GAMEBOY<br>STREET FIGHTER</h1>
                        <h2>ELIGE TU LUCHADOR</h2>
                        
                        <div class="selector-personajes">
                            <div class="personaje-opcion seleccionado" data-personaje="1">
                                <img src="001.png" alt="Personaje 1">
                                <h3>Abuela Tech</h3>
                                <div class="stats">Vida: ★★★<br>Vel: ★★<br>Daño: ★★</div>
                            </div>
                            <div class="personaje-opcion" data-personaje="2">
                                <img src="002.png" alt="Personaje 2">
                                <h3>Niña Punk</h3>
                                <div class="stats">Vida: ★★<br>Vel: ★★★<br>Daño: ★★★</div>
                            </div>
                            <div class="personaje-opcion" data-personaje="3">
                                <img src="003.png" alt="Personaje 3">
                                <h3>Abuela Cool</h3>
                                <div class="stats">Vida: ★★★★<br>Vel: ★<br>Daño: ★★★</div>
                            </div>
                        </div>
                    </div>

                    <div id="pantalla-final" class="pantalla oculto">
                        <h1 id="resultado-final-titulo">¡GANASTE!</h1>
                        <div id="resultado-final"></div>
                        <button class="btn-juego seleccionado" id="btn-reiniciar">JUGAR OTRA VEZ</button>
                    </div>
                </div>
            </div>

            <div id="btn-up" class="boton-tactil" data-tecla="arrowup"></div>
            <div id="btn-down" class="boton-tactil" data-tecla="arrowdown"></div>
            <div id="btn-left" class="boton-tactil" data-tecla="arrowleft"></div>
            <div id="btn-right" class="boton-tactil" data-tecla="arrowright"></div>
            <div id="btn-a" class="boton-tactil" data-tecla="z"></div>
            <div id="btn-b" class="boton-tactil" data-tecla="x"></div>
            <div id="btn-x" class="boton-tactil" data-tecla="c"></div>
            <div id="btn-y" class="boton-tactil" data-tecla="v"></div>
            <div id="btn-select" class="boton-tactil" data-tecla="select"></div>
            <div id="btn-start" class="boton-tactil" data-tecla="start"></div>
        </div>
    </div>

    <script>
        function vibrarBoton() {
            try {
                if (navigator.vibrate) {
                    navigator.vibrate(30);
                }
            } catch(e) {}
        }

        function escalarConsola() {
            const wrapper = document.getElementById('consola-wrapper');
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const scaleX = windowWidth / 572;
            const scaleY = windowHeight / 1024;
            const scale = Math.min(scaleX, scaleY, 1);
            wrapper.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', escalarConsola);
        window.addEventListener('load', escalarConsola);
        escalarConsola();

        let audioCtx = null;
        let sonidoActivado = true;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function sonidoGolpe(tipo) {
            if (!sonidoActivado || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const now = audioCtx.currentTime;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            if (tipo === 'puñetazo') {
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (tipo === 'patada') {
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (tipo === 'especial') {
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        function sonidoBloqueo() {
            if (!sonidoActivado || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const now = audioCtx.currentTime;
            osc.type = 'square';
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(400, now + 0.05);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
        }

        function sonidoKO() {
            if (!sonidoActivado || !audioCtx) return;
            const now = audioCtx.currentTime;
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.connect(gain1); gain1.connect(audioCtx.destination);
            osc1.type = 'sawtooth';
            osc1.frequency.setValueAtTime(200, now);
            osc1.frequency.exponentialRampToValueAtTime(50, now + 0.5);
            gain1.gain.setValueAtTime(0.4, now);
            gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc1.start(now); osc1.stop(now + 0.5);
            const bufferSize = audioCtx.sampleRate * 0.3;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const noiseGain = audioCtx.createGain();
            noise.connect(noiseGain); noiseGain.connect(audioCtx.destination);
            noiseGain.gain.setValueAtTime(0.3, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            noise.start(now);
        }

        function sonidoRoundStart() {
            if (!sonidoActivado || !audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, now);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now); osc.stop(now + 0.5);
            setTimeout(() => {
                if (!sonidoActivado || !audioCtx) return;
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2); gain2.connect(audioCtx.destination);
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(1100, audioCtx.currentTime);
                gain2.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc2.start(audioCtx.currentTime); osc2.stop(audioCtx.currentTime + 0.5);
            }, 200);
        }

        function sonidoVictoria() {
            if (!sonidoActivado || !audioCtx) return;
            const notas = [523, 659, 784, 1047];
            notas.forEach((freq, i) => {
                setTimeout(() => {
                    if (!sonidoActivado || !audioCtx) return;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.3);
                }, i * 150);
            });
        }

        function sonidoDerrota() {
            if (!sonidoActivado || !audioCtx) return;
            const notas = [400, 350, 300, 200];
            notas.forEach((freq, i) => {
                setTimeout(() => {
                    if (!sonidoActivado || !audioCtx) return;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.4);
                }, i * 200);
            });
        }

        // ============================================================
        // PARALLAX DEL FONDO
        // ============================================================
        const PARALLAX_FACTOR = 0.4; // Factor de movimiento del fondo (0-1)
        const POSICION_INICIAL_X = 200; // Posición inicial del jugador

        function actualizarFondo() {
            const juego = document.getElementById('juego');
            // Calcular desplazamiento basado en la posición del jugador
            const desplazamiento = (posXJugador - POSICION_INICIAL_X) * PARALLAX_FACTOR;
            // Aplicar al background-position (50% es el centro inicial)
            juego.style.backgroundPositionX = `calc(50% - ${desplazamiento}px)`;
        }

        let estadoJuego = 'menu';
        let indicePersonaje = 0;
        let menuCooldown = false;

        function actualizarSeleccionMenu() {
            document.querySelectorAll('.personaje-opcion').forEach(el => {
                el.classList.remove('seleccionado');
            });
            const opciones = document.querySelectorAll('.personaje-opcion');
            if (opciones[indicePersonaje]) {
                opciones[indicePersonaje].classList.add('seleccionado');
            }
            const nombres = ['Abuela Tech', 'Niña Punk', 'Abuela Cool'];
            document.getElementById('modo-indicador').innerText = 'MENÚ: ' + nombres[indicePersonaje];
        }

        function confirmarSeleccionPersonaje() {
            const num = indicePersonaje + 1;
            seleccionarPersonaje(num);
        }

        function seleccionarPersonaje(num) {
            initAudio();
            vibrarBoton();
            jugadorNum = num;
            rivalesDisponibles = [1, 2, 3].filter(n => n !== num);
            rivalesDisponibles.sort(() => Math.random() - 0.5);
            indiceRivalActual = 0;
            jugadorConfig = PERSONAJES[jugadorNum];
            rivalNum = rivalesDisponibles[0];
            rivalConfig = PERSONAJES[rivalNum];
            roundActual = 1; victoriasJugador = 0; victoriasRival = 0;
            iniciarRound();
        }

        const teclas = {};

        function activarTecla(tecla) { 
            teclas[tecla] = true; 
            initAudio();
            vibrarBoton();
            if (estadoJuego === 'menu') manejarMenu(tecla);
            else if (estadoJuego === 'round') manejarRound(tecla);
            else if (estadoJuego === 'final') manejarFinal(tecla);
        }
        
        function desactivarTecla(tecla) { teclas[tecla] = false; }

        function manejarMenu(tecla) {
            if (menuCooldown) return;
            if (tecla === 'arrowleft') {
                indicePersonaje = Math.max(0, indicePersonaje - 1);
                actualizarSeleccionMenu();
                menuCooldown = true;
                setTimeout(() => menuCooldown = false, 200);
            } else if (tecla === 'arrowright') {
                indicePersonaje = Math.min(2, indicePersonaje + 1);
                actualizarSeleccionMenu();
                menuCooldown = true;
                setTimeout(() => menuCooldown = false, 200);
            } else if (tecla === 'z' || tecla === 'start') {
                confirmarSeleccionPersonaje();
            }
        }

        function manejarRound(tecla) {
            if (tecla === 'z' || tecla === 'start') siguienteRound();
        }

        function manejarFinal(tecla) {
            if (tecla === 'z' || tecla === 'start') location.reload();
        }

        document.querySelectorAll('.boton-tactil').forEach(btn => {
            const tecla = btn.dataset.tecla;
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); activarTecla(tecla); btn.classList.add('activo'); });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); desactivarTecla(tecla); btn.classList.remove('activo'); });
            btn.addEventListener('touchcancel', (e) => { e.preventDefault(); desactivarTecla(tecla); btn.classList.remove('activo'); });
            btn.addEventListener('mousedown', (e) => { e.preventDefault(); activarTecla(tecla); btn.classList.add('activo'); });
            btn.addEventListener('mouseup', (e) => { e.preventDefault(); desactivarTecla(tecla); btn.classList.remove('activo'); });
            btn.addEventListener('mouseleave', () => { desactivarTecla(tecla); btn.classList.remove('activo'); });
        });

        document.addEventListener('keydown', (e) => { 
            teclas[e.key.toLowerCase()] = true; 
            e.preventDefault(); 
            initAudio();
            activarTecla(e.key.toLowerCase());
        });
        document.addEventListener('keyup', (e) => teclas[e.key.toLowerCase()] = false);

        const PERSONAJES = {
            1: { nombre: 'Abuela Tech', avatar: '001.png', spriteSheet: 'spritesheet.png', vida: 120, velocidad: 4, daño: 10 },
            2: { nombre: 'Niña Punk', avatar: '002.png', spriteSheet: 'spritesheet2.png', vida: 100, velocidad: 6, daño: 15 },
            3: { nombre: 'Abuela Cool', avatar: '003.png', spriteSheet: 'spritesheet3.png', vida: 150, velocidad: 3, daño: 18 }
        };

        let FRAME_WIDTH = 0, FRAME_HEIGHT = 0;
        const COLS = 5, ROWS = 2;

        const ANIMACIONES = {
            idle: [0, 0], caminar1: [0, 1], caminar2: [0, 2], saltando: [0, 3], puñetazo: [0, 4],
            patada: [1, 0], especial: [1, 1], golpeado: [1, 2], derrotado: [1, 3], defensa: [1, 4]
        };

        let spriteSheets = {}, jugadorConfig, rivalConfig, jugadorNum, rivalNum;
        let vidaJugador, vidaRival, posXJugador, posXRival, tiempo = 60;
        let juegoActivo = false, cooldownAtaque = false;
        let estadoJugador = 'idle', estadoRival = 'idle';
        let animTimer = 0, animTimerRival = 0;
        let estaSaltando = false, estaDefendiendo = false;
        let roundActual = 1;
        const TOTAL_ROUNDS = 3;
        let victoriasJugador = 0, victoriasRival = 0;
        let rivalesDisponibles = [], indiceRivalActual = 0;

        function cargarSpriteSheets() {
            return Promise.all([
                new Promise((resolve, reject) => {
                    const img = new Image(); img.src = 'spritesheet.png';
                    img.onload = () => { spriteSheets[1] = img; FRAME_WIDTH = img.width / COLS; FRAME_HEIGHT = img.height / ROWS; resolve(); };
                    img.onerror = reject;
                }),
                new Promise((resolve, reject) => {
                    const img = new Image(); img.src = 'spritesheet2.png';
                    img.onload = () => { spriteSheets[2] = img; resolve(); };
                    img.onerror = reject;
                }),
                new Promise((resolve, reject) => {
                    const img = new Image(); img.src = 'spritesheet3.png';
                    img.onload = () => { spriteSheets[3] = img; resolve(); };
                    img.onerror = reject;
                })
            ]);
        }

        function dibujarFrame(canvas, spriteSheet, fila, columna, voltear) {
            if (!spriteSheet) return;
            const ctx = canvas.getContext('2d');
            canvas.width = FRAME_WIDTH; canvas.height = FRAME_HEIGHT;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            if (voltear) { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
            ctx.drawImage(spriteSheet, columna * FRAME_WIDTH, fila * FRAME_HEIGHT, FRAME_WIDTH, FRAME_HEIGHT, 0, 0, canvas.width, canvas.height);
            ctx.restore();
        }

        function dibujarDerrotado(quien) {
            const canvas = document.querySelector('#' + quien + ' canvas');
            const num = quien === 'jugador' ? jugadorNum : rivalNum;
            const frame = ANIMACIONES['derrotado'];
            const voltear = quien === 'jugador' ? (posXRival <= posXJugador) : (posXJugador <= posXRival);
            dibujarFrame(canvas, spriteSheets[num], frame[0], frame[1], voltear);
        }

        function iniciarRound() {
            estadoJuego = 'combate';
            document.getElementById('modo-indicador').innerText = 'COMBATE: Round ' + roundActual;
            document.getElementById('pantalla-inicio').classList.add('oculto');
            document.getElementById('pantalla-final').classList.add('oculto');
            document.getElementById('hud').classList.remove('oculto');
            document.getElementById('nombre-jugador').innerText = jugadorConfig.nombre;
            document.getElementById('nombre-rival').innerText = rivalConfig.nombre;
            document.getElementById('round-info').innerText = 'Round ' + roundActual + '/' + TOTAL_ROUNDS;
            actualizarMarcador();
            const jugadorEl = document.getElementById('jugador');
            const rivalEl = document.getElementById('rival');
            jugadorEl.classList.remove('oculto'); rivalEl.classList.remove('oculto');
            posXJugador = 200; posXRival = 320;
            jugadorEl.style.left = posXJugador + 'px'; rivalEl.style.left = posXRival + 'px';
            vidaJugador = jugadorConfig.vida; vidaRival = rivalConfig.vida;
            actualizarBarrasVida();
            actualizarFondo(); // Inicializar posición del fondo
            mostrarAnuncio('¡ROUND ' + roundActual + '!');
            sonidoRoundStart();
            juegoActivo = true; tiempo = 60;
            document.getElementById('timer').innerText = tiempo;
            const timerInterval = setInterval(() => {
                if (!juegoActivo) { clearInterval(timerInterval); return; }
                tiempo--;
                document.getElementById('timer').innerText = tiempo;
                if (tiempo <= 0) {
                    if (vidaJugador > vidaRival) ganarRound();
                    else if (vidaRival > vidaJugador) perderRound();
                    else ganarRound();
                    clearInterval(timerInterval);
                }
            }, 1000);
            bucleJuego();
        }

        function bucleJuego() {
            if (!juegoActivo) return;
            const jugadorCanvas = document.querySelector('#jugador canvas');
            const rivalCanvas = document.querySelector('#rival canvas');
            let moviendose = false;
            if (teclas['v'] && estadoJugador === 'idle') { estaDefendiendo = true; estadoJugador = 'defensa'; }
            else if (!teclas['v'] && estadoJugador === 'defensa') { estaDefendiendo = false; estadoJugador = 'idle'; }
            if (!estaDefendiendo && !estaSaltando && estadoJugador !== 'derrotado') {
                if (teclas['arrowleft'] && posXJugador > 0) { posXJugador -= jugadorConfig.velocidad; moviendose = true; }
                if (teclas['arrowright'] && posXJugador < 415) { posXJugador += jugadorConfig.velocidad; moviendose = true; }
                if (teclas['arrowup'] && !estaSaltando && estadoJugador === 'idle') {
                    estaSaltando = true; estadoJugador = 'saltando';
                    const jugadorEl = document.getElementById('jugador');
                    jugadorEl.style.bottom = 'calc(5% + 50px)';
                    setTimeout(() => { jugadorEl.style.bottom = '5%'; }, 300);
                    setTimeout(() => { estaSaltando = false; if (vidaJugador > 0) estadoJugador = 'idle'; }, 600);
                }
                if (moviendose && estadoJugador === 'idle') {
                    animTimer++;
                    if (animTimer < 15) estadoJugador = 'caminar1';
                    else if (animTimer < 30) estadoJugador = 'caminar2';
                    else animTimer = 0;
                } else if (!moviendose && (estadoJugador === 'caminar1' || estadoJugador === 'caminar2')) {
                    estadoJugador = 'idle'; animTimer = 0;
                }
            }
            document.getElementById('jugador').style.left = posXJugador + 'px';
            
            // ACTUALIZAR PARALLAX DEL FONDO
            actualizarFondo();
            
            const mirarDerechaJugador = posXRival > posXJugador;
            const frameJugador = ANIMACIONES[estadoJugador];
            dibujarFrame(jugadorCanvas, spriteSheets[jugadorNum], frameJugador[0], frameJugador[1], !mirarDerechaJugador);
            if (!cooldownAtaque && !estaDefendiendo && !estaSaltando && estadoJugador !== 'derrotado' &&
                (estadoJugador === 'idle' || estadoJugador === 'caminar1' || estadoJugador === 'caminar2')) {
                if (teclas['z']) atacar('puñetazo', jugadorConfig.daño, 300);
                else if (teclas['x']) atacar('patada', jugadorConfig.daño * 1.5, 400);
                else if (teclas['c']) atacar('especial', jugadorConfig.daño * 2.5, 500);
            }
            let moviendoseRival = false;
            if (estadoRival !== 'puñetazo' && estadoRival !== 'patada' && estadoRival !== 'especial' && 
                estadoRival !== 'golpeado' && estadoRival !== 'derrotado' && estadoRival !== 'defensa') {
                if (posXRival > posXJugador + 100) { posXRival -= rivalConfig.velocidad * 0.6; moviendoseRival = true; }
                else if (posXRival < posXJugador - 100) { posXRival += rivalConfig.velocidad * 0.6; moviendoseRival = true; }
                if (moviendoseRival) {
                    animTimerRival++;
                    if (animTimerRival < 15) estadoRival = 'caminar1';
                    else if (animTimerRival < 30) estadoRival = 'caminar2';
                    else animTimerRival = 0;
                } else if (estadoRival === 'caminar1' || estadoRival === 'caminar2') {
                    estadoRival = 'idle'; animTimerRival = 0;
                }
                if (Math.random() < 0.005 && Math.abs(posXRival - posXJugador) < 150) {
                    estadoRival = 'defensa';
                    setTimeout(() => { if (estadoRival === 'defensa') estadoRival = 'idle'; }, 500);
                }
            }
            document.getElementById('rival').style.left = posXRival + 'px';
            const mirarDerechaRival = posXJugador > posXRival;
            const frameRival = ANIMACIONES[estadoRival];
            dibujarFrame(rivalCanvas, spriteSheets[rivalNum], frameRival[0], frameRival[1], !mirarDerechaRival);
            if (Math.random() < 0.015 && Math.abs(posXRival - posXJugador) < 150 && 
                estadoRival !== 'puñetazo' && estadoRival !== 'patada' && estadoRival !== 'especial' && 
                estadoRival !== 'golpeado' && estadoRival !== 'defensa' && estadoRival !== 'derrotado') {
                const ataques = ['puñetazo', 'patada', 'especial'];
                const ataqueRival = ataques[Math.floor(Math.random() * ataques.length)];
                const dañoRival = ataqueRival === 'puñetazo' ? rivalConfig.daño : 
                                 ataqueRival === 'patada' ? rivalConfig.daño * 1.5 : rivalConfig.daño * 2.5;
                const duracion = ataqueRival === 'puñetazo' ? 300 : ataqueRival === 'patada' ? 400 : 500;
                atacarRival(ataqueRival, dañoRival, duracion);
            }
            requestAnimationFrame(bucleJuego);
        }

        function atacar(tipo, daño, duracion) {
            cooldownAtaque = true; estadoJugador = tipo;
            const distancia = Math.abs(posXRival - posXJugador);
            sonidoGolpe(tipo);
            if (distancia < 120) {
                setTimeout(() => {
                    let dañoFinal = daño;
                    if (estadoRival === 'defensa') {
                        dañoFinal = daño * 0.2;
                        mostrarEfectoGolpe(posXRival, 'BLOQ'); 
                        sonidoBloqueo();
                    } else {
                        estadoRival = 'golpeado';
                        mostrarEfectoGolpe(posXRival, tipo);
                    }
                    vidaRival -= dañoFinal; actualizarBarrasVida();
                    setTimeout(() => { if (vidaRival > 0 && estadoRival !== 'defensa') estadoRival = 'idle'; }, 300);
                    if (vidaRival <= 0) {
                        estadoRival = 'derrotado'; dibujarDerrotado('rival'); sonidoKO();
                        setTimeout(() => { ganarRound(); }, 2000);
                    }
                }, 100);
            }
            setTimeout(() => {
                cooldownAtaque = false;
                if (vidaRival > 0 && estadoJugador !== 'saltando' && estadoJugador !== 'defensa') estadoJugador = 'idle';
            }, duracion);
        }

        function atacarRival(tipo, daño, duracion) {
            estadoRival = tipo;
            const distancia = Math.abs(posXRival - posXJugador);
            if (distancia < 120) {
                setTimeout(() => {
                    let dañoFinal = daño;
                    if (estaDefendiendo) {
                        dañoFinal = daño * 0.2;
                        mostrarEfectoGolpe(posXJugador, 'BLOQ'); 
                        sonidoBloqueo();
                    } else {
                        estadoJugador = 'golpeado';
                        mostrarEfectoGolpe(posXJugador, tipo);
                    }
                    vidaJugador -= dañoFinal; actualizarBarrasVida();
                    setTimeout(() => { if (vidaJugador > 0 && !estaDefendiendo) estadoJugador = 'idle'; }, 300);
                    if (vidaJugador <= 0) {
                        estadoJugador = 'derrotado'; dibujarDerrotado('jugador'); sonidoKO();
                        setTimeout(() => { perderRound(); }, 2000);
                    }
                }, 100);
            }
            setTimeout(() => {
                if (vidaRival > 0 && estadoRival !== 'golpeado' && estadoRival !== 'derrotado' && estadoRival !== 'defensa') estadoRival = 'idle';
            }, duracion);
        }

        function ganarRound() {
            if (!juegoActivo) return;
            juegoActivo = false; victoriasJugador++; actualizarMarcador(); sonidoVictoria();
            setTimeout(() => {
                if (victoriasJugador >= 2 || roundActual >= TOTAL_ROUNDS) mostrarResultadoFinal(true);
                else mostrarPantallaRound(true);
            }, 500);
        }

        function perderRound() {
            if (!juegoActivo) return;
            juegoActivo = false; victoriasRival++; actualizarMarcador(); sonidoDerrota();
            setTimeout(() => {
                if (victoriasRival >= 2 || roundActual >= TOTAL_ROUNDS) mostrarResultadoFinal(false);
                else mostrarPantallaRound(false);
            }, 500);
        }

        function mostrarPantallaRound(ganoJugador) {
            estadoJuego = 'round';
            document.getElementById('modo-indicador').innerText = 'FIN DE ROUND: Pulsa A para continuar';
            roundActual++;
            indiceRivalActual = (indiceRivalActual + 1) % rivalesDisponibles.length;
            rivalNum = rivalesDisponibles[indiceRivalActual];
            rivalConfig = PERSONAJES[rivalNum];
            const titulo = document.getElementById('round-titulo');
            const mensaje = document.getElementById('round-mensaje');
            titulo.innerText = '¡ROUND ' + roundActual + '!';
            titulo.style.color = ganoJugador ? '#0f0' : '#f00';
            mensaje.innerText = (ganoJugador ? '¡Ganaste el round anterior!\n' : 'Perdiste el round anterior.\n') + 
                                'Siguiente rival: ' + rivalConfig.nombre;
            document.getElementById('pantalla-round').classList.add('visible');
        }

        function siguienteRound() {
            vibrarBoton();
            document.getElementById('pantalla-round').classList.remove('visible');
            estadoJugador = 'idle'; estadoRival = 'idle';
            estaSaltando = false; estaDefendiendo = false; cooldownAtaque = false;
            iniciarRound();
        }

        function mostrarResultadoFinal(gano) {
            estadoJuego = 'final';
            document.getElementById('modo-indicador').innerText = 'FIN DEL JUEGO: Pulsa A para reiniciar';
            document.getElementById('hud').classList.add('oculto');
            document.getElementById('jugador').classList.add('oculto');
            document.getElementById('rival').classList.add('oculto');
            const titulo = document.getElementById('resultado-final-titulo');
            const resultado = document.getElementById('resultado-final');
            if (gano) {
                titulo.innerText = '¡CAMPEÓN!'; titulo.style.color = '#0f0';
                resultado.innerHTML = '<p style="color: #0f0; font-size: 16px;">¡Ganaste el combate!</p>' +
                    '<p style="color: #fff;">Victorias: ' + victoriasJugador + ' - ' + victoriasRival + '</p>' +
                    '<p style="color: #ff0;">Derrotaste a todos tus rivales</p>';
            } else {
                titulo.innerText = '¡DERROTADO!'; titulo.style.color = '#f00';
                resultado.innerHTML = '<p style="color: #f00; font-size: 16px;">Perdiste el combate</p>' +
                    '<p style="color: #fff;">Victorias: ' + victoriasJugador + ' - ' + victoriasRival + '</p>' +
                    '<p style="color: #ff0;">Inténtalo de nuevo</p>';
            }
            document.getElementById('pantalla-final').classList.remove('oculto');
        }

        function actualizarMarcador() {
            for (let i = 1; i <= 3; i++) document.getElementById('v-j' + i).classList.remove('ganada');
            for (let i = 1; i <= victoriasJugador; i++) document.getElementById('v-j' + i).classList.add('ganada');
        }

        function mostrarEfectoGolpe(x, tipo) {
            const efecto = document.createElement('div');
            efecto.className = 'efecto-golpe';
            if (tipo === 'puñetazo') efecto.innerText = 'POW!';
            else if (tipo === 'patada') efecto.innerText = 'BAM!';
            else if (tipo === 'especial') efecto.innerText = 'BOOM!';
            else efecto.innerText = 'BLOQ!';
            efecto.style.left = x + 'px'; efecto.style.bottom = '40%';
            document.getElementById('juego').appendChild(efecto);
            setTimeout(() => efecto.remove(), 500);
        }

        function mostrarAnuncio(texto) {
            const anuncio = document.createElement('div');
            anuncio.id = 'anuncio'; anuncio.innerText = texto;
            document.getElementById('juego').appendChild(anuncio);
            setTimeout(() => anuncio.remove(), 2000);
        }

        function actualizarBarrasVida() {
            document.getElementById('vida-jugador').style.width = Math.max(0, (vidaJugador / jugadorConfig.vida) * 100) + '%';
            document.getElementById('vida-rival').style.width = Math.max(0, (vidaRival / rivalConfig.vida) * 100) + '%';
        }

        actualizarSeleccionMenu();
        cargarSpriteSheets().then(() => console.log('Spritesheets cargados')).catch(() => console.error('Error cargando spritesheets'));
    </script>
</body>
</html>
