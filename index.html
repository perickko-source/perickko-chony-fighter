<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CHONY GAMEBOY - Street Fighter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            overflow: hidden;
            background: #b7b5b8;
            font-family: 'Arial Black', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            height: 100vh;
        }

        #consola-wrapper {
            position: relative;
            width: 572px;
            height: 1024px;
            transform-origin: center center;
        }

        #consola {
            position: relative;
            width: 572px;
            height: 1024px;
        }

        #consola-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #pantalla-juego {
            position: absolute;
            top: 65px;
            left: 21px;
            width: 525px;
            height: 408px;
            z-index: 2;
            overflow: hidden;
            background: transparent;
        }

        #juego {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: url('escenario.png');
            background-size: auto 100%;
            background-position: center bottom;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        #juego::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.2) 100%);
            z-index: 1;
            pointer-events: none;
        }

        #hud {
            position: absolute;
            top: 5px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            z-index: 100;
        }

        .barra-vida-container {
            width: 35%;
            height: 20px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #fff;
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .barra-vida {
            height: 100%;
            background: linear-gradient(to bottom, #ff0, #f00);
            transition: width 0.3s;
        }

        .nombre-luchador {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 10px;
            font-weight: bold;
            text-shadow: 1px 1px #000;
            z-index: 10;
            white-space: nowrap;
        }

        #timer-container { text-align: center; }

        #timer {
            width: 50px;
            height: 30px;
            background: rgba(0,0,0,0.8);
            border: 2px solid #fff;
            color: #ff0;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
        }

        #round-info {
            color: #0f0;
            font-size: 10px;
            margin-top: 2px;
            text-shadow: 1px 1px #000;
        }

        #marcador {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 3px;
        }

        .victoria-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #333;
            border: 1px solid #666;
        }

        .victoria-dot.ganada {
            background: #0f0;
            border-color: #0f0;
            box-shadow: 0 0 5px #0f0;
        }

        .luchador {
            position: absolute;
            bottom: 2%;
            width: 140px;
            height: 210px;
            z-index: 50;
        }

        .luchador.tanque {
            width: 168px;
            height: 252px;
        }

        .luchador canvas {
            width: 100%;
            height: 100%;
        }

        .efecto-golpe {
            position: absolute;
            font-size: 30px;
            font-weight: bold;
            color: #ff0;
            text-shadow: 2px 2px #f00;
            animation: golpeAnim 0.5s forwards;
            z-index: 200;
            pointer-events: none;
        }

        @keyframes golpeAnim {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.5) rotate(180deg); }
            100% { transform: scale(2) rotate(360deg); opacity: 0; }
        }

        .pantalla {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .pantalla h1 {
            font-size: 24px;
            color: #ff0;
            text-shadow: 2px 2px #f00;
            margin-bottom: 15px;
            text-align: center;
        }

        .pantalla h2 {
            font-size: 16px;
            color: #fff;
            margin-bottom: 10px;
        }

        .selector-personajes {
            display: flex;
            gap: 10px;
            margin: 10px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .personaje-opcion {
            text-align: center;
            padding: 8px;
            border: 2px solid #555;
            border-radius: 5px;
            transition: all 0.2s;
            background: rgba(255,255,255,0.1);
        }

        .personaje-opcion.seleccionado {
            border: 3px solid #ff0;
            background: rgba(255,255,0,0.25);
            box-shadow: 0 0 15px rgba(255,255,0,0.6);
            transform: scale(1.05);
        }

        .personaje-opcion img {
            height: 110px;
            object-fit: contain;
        }

        .personaje-opcion h3 {
            color: #fff;
            font-size: 10px;
            margin: 5px 0;
        }

        .stats {
            color: #aaa;
            font-size: 8px;
            line-height: 1.3;
        }

        .stats span { color: #0f0; }

        .btn-juego {
            padding: 8px 20px;
            font-size: 14px;
            background: #ff0;
            color: #000;
            border: 3px solid #555;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Arial Black', sans-serif;
            font-weight: bold;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .btn-juego.seleccionado {
            border-color: #ff0;
            background: #fff;
            box-shadow: 0 0 15px rgba(255,255,0,0.8);
            transform: scale(1.1);
        }

        .oculto { display: none !important; }

        #anuncio {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            color: #ff0;
            text-shadow: 3px 3px #f00, -1px -1px #000, 1px -1px #000, -1px 1px #000, 1px 1px #000;
            z-index: 500;
            animation: anuncioAnim 2s forwards;
            pointer-events: none;
        }

        @keyframes anuncioAnim {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        }

        #pantalla-round {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 900;
        }

        #pantalla-round.visible { display: flex; }

        #pantalla-round h2 {
            font-size: 28px;
            color: #ff0;
            text-shadow: 2px 2px #f00;
            margin-bottom: 10px;
        }

        #pantalla-round p {
            font-size: 14px;
            color: #fff;
            margin-bottom: 15px;
            text-align: center;
            white-space: pre-line;
        }

        #pantalla-final h1 { font-size: 32px; }

        #resultado-final {
            font-size: 16px;
            color: #fff;
            margin: 10px 0;
            text-align: center;
        }

        .boton-tactil {
            position: absolute;
            z-index: 1000;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            -webkit-touch-callout: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .boton-tactil:active { opacity: 0.3; }

        #btn-up { top: 586px; left: 113px; width: 70px; height: 70px; }
        #btn-down { top: 733px; left: 117px; width: 70px; height: 70px; }
        #btn-left { top: 657px; left: 43px; width: 70px; height: 70px; }
        #btn-right { top: 657px; left: 183px; width: 70px; height: 70px; }
        #btn-x { top: 585px; left: 392px; width: 75px; height: 75px; }
        #btn-y { top: 661px; left: 321px; width: 75px; height: 75px; }
        #btn-a { top: 660px; left: 465px; width: 75px; height: 75px; }
        #btn-b { top: 734px; left: 395px; width: 75px; height: 75px; }
        #btn-select { top: 875px; left: 209px; width: 85px; height: 45px; }
        #btn-start { top: 874px; left: 298px; width: 85px; height: 45px; }

        /* Botones diagonales calibrados */
        #btn-diag-up-left { top: 608px; left: 63px; width: 50px; height: 50px; }
        #btn-diag-up-right { top: 606px; left: 190px; width: 50px; height: 50px; }
        #btn-diag-down-left { top: 735px; left: 64px; width: 50px; height: 50px; }
        #btn-diag-down-right { top: 736px; left: 190px; width: 50px; height: 50px; }

        .boton-tactil.activo { opacity: 0.3; }

        #modo-indicador {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            color: #0f0;
            font-size: 9px;
            background: rgba(0,0,0,0.7);
            padding: 2px 8px;
            border-radius: 3px;
            z-index: 100;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="consola-wrapper">
        <div id="consola">
            <img id="consola-bg" src="chony-gameboy.png" alt="CHONY GAMEBOY">

            <div id="pantalla-juego">
                <div id="juego">
                    <div id="modo-indicador">MENÚ: Elige personaje</div>

                    <div id="hud" class="oculto">
                        <div class="barra-vida-container">
                            <div class="barra-vida" id="vida-jugador" style="width: 100%;"></div>
                            <div class="nombre-luchador" id="nombre-jugador">JUGADOR</div>
                        </div>
                        <div id="timer-container">
                            <div id="timer">60</div>
                            <div id="round-info">Round 1/3</div>
                            <div id="marcador">
                                <div class="victoria-dot" id="v-j1"></div>
                                <div class="victoria-dot" id="v-j2"></div>
                                <div class="victoria-dot" id="v-j3"></div>
                            </div>
                        </div>
                        <div class="barra-vida-container">
                            <div class="barra-vida" id="vida-rival" style="width: 100%;"></div>
                            <div class="nombre-luchador" id="nombre-rival">RIVAL</div>
                        </div>
                    </div>

                    <div id="jugador" class="luchador oculto"><canvas></canvas></div>
                    <div id="rival" class="luchador oculto"><canvas></canvas></div>

                    <div id="pantalla-round">
                        <h2 id="round-titulo">¡ROUND 2!</h2>
                        <p id="round-mensaje">Prepárate</p>
                        <button class="btn-juego seleccionado" id="btn-continuar">CONTINUAR</button>
                    </div>

                    <div id="pantalla-inicio" class="pantalla">
                        <h1>CHONY GAMEBOY<br>STREET FIGHTER</h1>
                        <h2>ELIGE TU LUCHADOR</h2>
                        
                        <div class="selector-personajes">
                            <div class="personaje-opcion seleccionado" data-personaje="1">
                                <img src="001.png" alt="Personaje 1">
                                <h3>Niña Punk</h3>
                                <div class="stats">Vida: ★★★<br>Vel: ★★<br>Daño: ★★</div>
                            </div>
                            <div class="personaje-opcion" data-personaje="2">
                                <img src="002.png" alt="Personaje 2">
                                <h3>Abuela Tech</h3>
                                <div class="stats">Vida: ★★<br>Vel: ★★★<br>Daño: ★★★</div>
                            </div>
                            <div class="personaje-opcion" data-personaje="3">
                                <img src="003.png" alt="Personaje 3">
                                <h3>Abuela Cool</h3>
                                <div class="stats">Vida: ★★★★<br>Vel: ★<br>Daño: ★★★</div>
                            </div>
                        </div>
                    </div>

                    <div id="pantalla-final" class="pantalla oculto">
                        <h1 id="resultado-final-titulo">¡GANASTE!</h1>
                        <div id="resultado-final"></div>
                        <button class="btn-juego seleccionado" id="btn-reiniciar">JUGAR OTRA VEZ</button>
                    </div>
                </div>
            </div>

            <!-- Botones de dirección -->
            <div id="btn-up" class="boton-tactil" data-tecla="arrowup"></div>
            <div id="btn-down" class="boton-tactil" data-tecla="arrowdown"></div>
            <div id="btn-left" class="boton-tactil" data-tecla="arrowleft"></div>
            <div id="btn-right" class="boton-tactil" data-tecla="arrowright"></div>
            
            <!-- Botones diagonales -->
            <div id="btn-diag-up-left" class="boton-tactil" data-tecla="diagonalupleft"></div>
            <div id="btn-diag-up-right" class="boton-tactil" data-tecla="diagonalupright"></div>
            <div id="btn-diag-down-left" class="boton-tactil" data-tecla="diagonaldownleft"></div>
            <div id="btn-diag-down-right" class="boton-tactil" data-tecla="diagonaldownright"></div>
            
            <!-- Botones de acción -->
            <div id="btn-x" class="boton-tactil" data-tecla="c"></div>
            <div id="btn-y" class="boton-tactil" data-tecla="v"></div>
            <div id="btn-a" class="boton-tactil" data-tecla="z"></div>
            <div id="btn-b" class="boton-tactil" data-tecla="x"></div>
            <div id="btn-select" class="boton-tactil" data-tecla="select"></div>
            <div id="btn-start" class="boton-tactil" data-tecla="start"></div>
        </div>
    </div>

    <script>
        function vibrarBoton() {
            try {
                if (navigator.vibrate) {
                    navigator.vibrate(30);
                }
            } catch(e) {}
        }

        function escalarConsola() {
            const wrapper = document.getElementById('consola-wrapper');
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const scaleX = windowWidth / 572;
            const scaleY = windowHeight / 1024;
            const scale = Math.min(scaleX, scaleY, 1);
            wrapper.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', escalarConsola);
        window.addEventListener('load', escalarConsola);
        escalarConsola();

        let sonidoActivado = true;

        const sonidos = {
            puñetazo: new Audio('puñetazo.mp3'),
            patada: new Audio('patada.mp3'),
            especial: new Audio('especial.mp3'),
            hadouken: new Audio('hadouken.mp3'),
            bloqueo: new Audio('bloqueo.mp3'),
            ko: new Audio('ko.mp3'),
            inicioround: new Audio('inicioround.mp3'),
            victoria: new Audio('victoria.mp3'),
            derrota: new Audio('derrota.mp3'),
            menu: new Audio('menu.mp3'),
            seleccion: new Audio('seleccion.mp3')
        };

        Object.values(sonidos).forEach(s => s.volume = 0.7);

        function reproducirSonido(nombre) {
            if (!sonidoActivado) return;
            const sonido = sonidos[nombre];
            if (sonido) {
                const clone = sonido.cloneNode(true);
                clone.volume = 0.7;
                clone.play().catch(e => console.log('Error reproduciendo ' + nombre + ':', e));
            }
        }

        const PARALLAX_FACTOR = 0.4;
        const POSICION_INICIAL_X = 30;

        function actualizarFondo() {
            const juego = document.getElementById('juego');
            const desplazamiento = (posXJugador - POSICION_INICIAL_X) * PARALLAX_FACTOR;
            juego.style.backgroundPositionX = `calc(50% - ${desplazamiento}px)`;
        }

        let estadoJuego = 'menu';
        let indicePersonaje = 0;
        let menuCooldown = false;

        function actualizarSeleccionMenu() {
            document.querySelectorAll('.personaje-opcion').forEach(el => {
                el.classList.remove('seleccionado');
            });
            const opciones = document.querySelectorAll('.personaje-opcion');
            if (opciones[indicePersonaje]) {
                opciones[indicePersonaje].classList.add('seleccionado');
            }
            const nombres = ['Niña Punk', 'Abuela Tech', 'Abuela Cool'];
            const indicador = document.getElementById('modo-indicador');
            indicador.innerText = 'MENÚ: ' + nombres[indicePersonaje];
            indicador.classList.remove('oculto');
        }

        function confirmarSeleccionPersonaje() {
            reproducirSonido('seleccion');
            const num = indicePersonaje + 1;
            seleccionarPersonaje(num);
        }

        function seleccionarPersonaje(num) {
            vibrarBoton();
            jugadorNum = num;
            rivalesDisponibles = [1, 2, 3].filter(n => n !== num);
            rivalesDisponibles.sort(() => Math.random() - 0.5);
            rivalesDisponibles.push(4);
            rivalesDisponibles.push(5);
            rivalesDisponibles.push(6);
            rivalesDisponibles.push(7);
            indiceRivalActual = 0;
            jugadorConfig = PERSONAJES[jugadorNum];
            rivalNum = rivalesDisponibles[0];
            rivalConfig = PERSONAJES[rivalNum];
            roundActual = 1;
            victoriasJugador = 0;
            victoriasRival = 0;
            iniciarRound();
        }

        const teclas = {};
        const teclasPulsadas = {};

        const MAX_TIEMPO_ENTRE_INPUTS = 500;
        let bufferInputs = [];
        let bolasEnergia = [];
        let ultimaTeclaDireccion = null;
        let tiempoUltimaDireccion = 0;

        let hadoukenImg = null;

        function registrarInputParaEspecial(tecla) {
            const ahora = Date.now();
            
            if (tecla === 'arrowleft' || tecla === 'arrowright' || tecla === 'diagonalupleft' || tecla === 'diagonalupright') {
                if (tecla === 'arrowleft' || tecla === 'arrowright') {
                    ultimaTeclaDireccion = tecla;
                    tiempoUltimaDireccion = ahora;
                }
            }
            
            if (tecla === 'z' && ultimaTeclaDireccion && (ahora - tiempoUltimaDireccion < MAX_TIEMPO_ENTRE_INPUTS)) {
                if (bolasEnergia.length === 0 && estadoJuego === 'combate') {
                    const rivalADerecha = posXRival > posXJugador;
                    const direccionCorrecta = (rivalADerecha && ultimaTeclaDireccion === 'arrowleft') ||
                                             (!rivalADerecha && ultimaTeclaDireccion === 'arrowright');
                    
                    if (direccionCorrecta) {
                        lanzarBolaEnergia();
                        ultimaTeclaDireccion = null;
                        tiempoUltimaDireccion = 0;
                    }
                }
            }
        }

        function lanzarBolaEnergia() {
            estadoJugador = 'puñetazo';
            reproducirSonido('hadouken');
            
            const direccion = (posXRival > posXJugador) ? 1 : -1;
            
            bolasEnergia.push({
                x: posXJugador + (direccion === 1 ? 140 : -40),
                y: 100,
                velocidad: 5 * direccion,
                radio: 25,
                activa: true
            });

            setTimeout(() => {
                if (vidaJugador > 0 && estadoJugador !== 'saltando' && estadoJugador !== 'defensa') {
                    estadoJugador = 'idle';
                }
            }, 300);
        }

        function actualizarBolasEnergia() {
            for (let i = bolasEnergia.length - 1; i >= 0; i--) {
                const bola = bolasEnergia[i];
                if (!bola.activa) {
                    bolasEnergia.splice(i, 1);
                    continue;
                }
                
                bola.x += bola.velocidad;
                
                const distanciaX = Math.abs(bola.x - (posXRival + 70));
                const distanciaY = Math.abs(bola.y - 100);
                
                if (distanciaX < (bola.radio + 70) && distanciaY < (bola.radio + 100)) {
                    let dañoFinal = 15;
                    if (estadoRival === 'defensa') {
                        dañoFinal = dañoFinal * 0.2;
                        mostrarEfectoGolpe(posXRival, 'BLOQ');
                        reproducirSonido('bloqueo');
                    } else {
                        estadoRival = 'golpeado';
                        mostrarEfectoGolpe(posXRival, 'especial');
                    }
                    vidaRival -= dañoFinal;
                    actualizarBarrasVida();
                    
                    setTimeout(() => {
                        if (vidaRival > 0 && estadoRival !== 'defensa') estadoRival = 'idle';
                    }, 300);
                    
                    if (vidaRival <= 0) {
                        estadoRival = 'derrotado';
                        dibujarDerrotado('rival');
                        reproducirSonido('ko');
                        setTimeout(() => { ganarRound(); }, 2000);
                    }
                    
                    bola.activa = false;
                    bolasEnergia.splice(i, 1);
                    continue;
                }
                
                if (bola.x > 525 || bola.x < -40) {
                    bola.activa = false;
                    bolasEnergia.splice(i, 1);
                }
            }
        }

        function dibujarBolasEnergia() {
            const juego = document.getElementById('juego');
            document.querySelectorAll('.bola-energia').forEach(el => el.remove());
            
            bolasEnergia.forEach(bola => {
                if (!bola.activa) return;
                
                const contenedor = document.createElement('div');
                contenedor.className = 'bola-energia';
                contenedor.style.position = 'absolute';
                contenedor.style.left = bola.x + 'px';
                contenedor.style.bottom = bola.y + 'px';
                contenedor.style.width = (bola.radio * 2) + 'px';
                contenedor.style.height = (bola.radio * 2) + 'px';
                contenedor.style.zIndex = '150';
                contenedor.style.pointerEvents = 'none';
                
                for (let i = 3; i >= 1; i--) {
                    const estela = document.createElement('div');
                    estela.style.position = 'absolute';
                    estela.style.left = (-i * 15) + 'px';
                    estela.style.top = '50%';
                    estela.style.transform = 'translateY(-50%)';
                    estela.style.width = (bola.radio * 2 - i * 5) + 'px';
                    estela.style.height = (bola.radio * 2 - i * 5) + 'px';
                    estela.style.borderRadius = '50%';
                    estela.style.background = `radial-gradient(circle, rgba(0,255,255,${0.5 - i * 0.1}) 0%, transparent 70%)`;
                    contenedor.appendChild(estela);
                }
                
                if (hadoukenImg && hadoukenImg.complete && hadoukenImg.naturalWidth > 0) {
                    const img = document.createElement('img');
                    img.src = 'hadouken.png';
                    img.style.position = 'absolute';

        function dibujarFrame(canvas, spriteSheet, fila, columna, voltear) {
            if (!spriteSheet) return;
            const ctx = canvas.getContext('2d');
            canvas.width = FRAME_WIDTH; canvas.height = FRAME_HEIGHT;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            if (voltear) { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
            ctx.drawImage(spriteSheet, columna * FRAME_WIDTH, fila * FRAME_HEIGHT, FRAME_WIDTH, FRAME_HEIGHT, 0, 0, canvas.width, canvas.height);
            ctx.restore();
        }

        function dibujarDerrotado(quien) {
            const canvas = document.querySelector('#' + quien + ' canvas');
            const num = quien === 'jugador' ? jugadorNum : rivalNum;
            const frame = ANIMACIONES['derrotado'];
            const voltear = quien === 'jugador' ? (posXRival <= posXJugador) : (posXJugador <= posXRival);
            dibujarFrame(canvas, spriteSheets[num], frame[0], frame[1], voltear);
        }

        function bucleJuego() {
            if (!juegoActivo) return;
            const jugadorCanvas = document.querySelector('#jugador canvas');
            const rivalCanvas = document.querySelector('#rival canvas');
            
            // ✅ CAMBIO INTEGRADO: Arriba/Abajo usan teclasPulsadas (una acción por toque), Izq/Der usan teclas (movimiento continuo)
            const pulsadoArriba = teclasPulsadas['arrowup'] || teclasPulsadas['diagonalupleft'] || teclasPulsadas['diagonalupright'];
            const pulsadoAbajo = teclasPulsadas['arrowdown'] || teclasPulsadas['diagonaldownleft'] || teclasPulsadas['diagonaldownright'];
            const pulsadoIzquierda = teclas['arrowleft'] || teclas['diagonalupleft'] || teclas['diagonaldownleft'];
            const pulsadoDerecha = teclas['arrowright'] || teclas['diagonalupright'] || teclas['diagonaldownright'];
            
            let moviendose = false;
            if (teclas['v'] && estadoJugador === 'idle') { estaDefendiendo = true; estadoJugador = 'defensa'; }
            else if (!teclas['v'] && estadoJugador === 'defensa') { estaDefendiendo = false; estadoJugador = 'idle'; }
            
            if (!estaDefendiendo && !estaSaltando && estadoJugador !== 'derrotado') {
                if (pulsadoIzquierda && posXJugador > 0) { posXJugador -= jugadorConfig.velocidad; moviendose = true; }
                if (pulsadoDerecha && posXJugador < 385) { posXJugador += jugadorConfig.velocidad; moviendose = true; }
                
                if (pulsadoArriba && !estaSaltando && estadoJugador === 'idle') {
                    estaSaltando = true;
                    estadoJugador = 'saltando';
                    const jugadorEl = document.getElementById('jugador');
                    jugadorEl.style.bottom = 'calc(2% + 50px)';
                    
                    let direccionSalto = 0;
                    if (pulsadoIzquierda) direccionSalto = -1;
                    else if (pulsadoDerecha) direccionSalto = 1;
                    
                    if (direccionSalto !== 0) {
                        const intervaloSalto = setInterval(() => {
                            if (!estaSaltando) {
                                clearInterval(intervaloSalto);
                                return;
                            }
                            posXJugador += direccionSalto * jugadorConfig.velocidad;
                            if (posXJugador < 0) posXJugador = 0;
                            if (posXJugador > 385) posXJugador = 385;
                        }, 16);
                    }
                    
                    setTimeout(() => { jugadorEl.style.bottom = '2%'; }, 300);
                    setTimeout(() => { 
                        estaSaltando = false; 
                        if (vidaJugador > 0) estadoJugador = 'idle'; 
                    }, 600);
                }
                
                if (moviendose && (estadoJugador === 'idle' || estadoJugador === 'caminar1' || estadoJugador === 'caminar2')) {
                    animTimer++;
                    if (animTimer < 15) estadoJugador = 'caminar1';
                    else if (animTimer < 30) estadoJugador = 'caminar2';
                    else animTimer = 0;
                } else if (!moviendose && (estadoJugador === 'caminar1' || estadoJugador === 'caminar2')) {
                    estadoJugador = 'idle'; animTimer = 0;
                }
            }
            
            document.getElementById('jugador').style.left = posXJugador + 'px';
            actualizarFondo();
            const mirarDerechaJugador = posXRival > posXJugador;
            const frameJugador = ANIMACIONES[estadoJugador];
            dibujarFrame(jugadorCanvas, spriteSheets[jugadorNum], frameJugador[0], frameJugador[1], !mirarDerechaJugador);
            
            if (!cooldownAtaque && !estaDefendiendo && !estaSaltando && estadoJugador !== 'derrotado' &&
                (estadoJugador === 'idle' || estadoJugador === 'caminar1' || estadoJugador === 'caminar2')) {
                if (teclasPulsadas['z']) atacar('puñetazo', jugadorConfig.daño, 300);
                else if (teclasPulsadas['x']) atacar('patada', jugadorConfig.daño * 1.5, 400);
                else if (teclasPulsadas['c']) atacar('especial', jugadorConfig.daño * 2.5, 500);
            }

            if (!cooldownAtaque && estaSaltando && teclasPulsadas['x']) {
                atacar('patada', jugadorConfig.daño * 1.2, 400);
            }
            
            let moviendoseRival = false;
            if (estadoRival !== 'puñetazo' && estadoRival !== 'patada' && estadoRival !== 'especial' && 
                estadoRival !== 'golpeado' && estadoRival !== 'derrotado' && estadoRival !== 'defensa') {
                if (posXRival > posXJugador + 100) { posXRival -= rivalConfig.velocidad * 0.6; moviendoseRival = true; }
                else if (posXRival < posXJugador - 100) { posXRival += rivalConfig.velocidad * 0.6; moviendoseRival = true; }
                if (moviendoseRival) {
                    animTimerRival++;
                    if (animTimerRival < 15) estadoRival = 'caminar1';
                    else if (animTimerRival < 30) estadoRival = 'caminar2';
                    else animTimerRival = 0;
                } else if (estadoRival === 'caminar1' || estadoRival === 'caminar2') {
                    estadoRival = 'idle'; animTimerRival = 0;
                }
                const probBloqueo = (rivalNum >= 4) ? 0.05 : 0.04;
                if (Math.random() < probBloqueo && Math.abs(posXRival - posXJugador) < 200) {
                    estadoRival = 'defensa';
                    setTimeout(() => { if (estadoRival === 'defensa') estadoRival = 'idle'; }, 800);
                }
                if (Math.random() < 0.01 && !rivalSaltando && estadoRival === 'idle') {
                    rivalSaltando = true;
                    estadoRival = 'saltando';
                    const rivalEl = document.getElementById('rival');
                    rivalEl.style.bottom = 'calc(2% + 50px)';
                    setTimeout(() => { rivalEl.style.bottom = '2%'; }, 300);
                    setTimeout(() => { rivalSaltando = false; if (vidaRival > 0) estadoRival = 'idle'; }, 600);
                }
            }
            document.getElementById('rival').style.left = posXRival + 'px';
            const mirarDerechaRival = posXJugador > posXRival;
            const frameRival = ANIMACIONES[estadoRival];
            dibujarFrame(rivalCanvas, spriteSheets[rivalNum], frameRival[0], frameRival[1], !mirarDerechaRival);
            if (Math.random() < 0.015 && Math.abs(posXRival - posXJugador) < 150 && 
                estadoRival !== 'puñetazo' && estadoRival !== 'patada' && estadoRival !== 'especial' && 
                estadoRival !== 'golpeado' && estadoRival !== 'defensa' && estadoRival !== 'derrotado' && !rivalSaltando) {
                const ataques = ['puñetazo', 'patada', 'especial'];
                const ataqueRival = ataques[Math.floor(Math.random() * ataques.length)];
                const dañoRival = ataqueRival === 'puñetazo' ? rivalConfig.daño : 
                                 ataqueRival === 'patada' ? rivalConfig.daño * 1.5 : rivalConfig.daño * 2.5;
                const duracion = ataqueRival === 'puñetazo' ? 300 : ataqueRival === 'patada' ? 400 : 500;
                atacarRival(ataqueRival, dañoRival, duracion);
            }
            
            actualizarBolasEnergia();
            dibujarBolasEnergia();
            
            for (let tecla in teclasPulsadas) {
                delete teclasPulsadas[tecla];
            }
            requestAnimationFrame(bucleJuego);
        }

        function atacar(tipo, daño, duracion) {
            cooldownAtaque = true; estadoJugador = tipo;
            const distancia = Math.abs(posXRival - posXJugador);
            reproducirSonido(tipo);
            if (distancia < 120) {
                setTimeout(() => {
                    let dañoFinal = daño;
                    if (estadoRival === 'defensa') {
                        dañoFinal = daño * 0.2;
                        mostrarEfectoGolpe(posXRival, 'BLOQ'); 
                        reproducirSonido('bloqueo');
                    } else {
                        estadoRival = 'golpeado';
                        mostrarEfectoGolpe(posXRival, tipo);
                    }
                    vidaRival -= dañoFinal; actualizarBarrasVida();
                    setTimeout(() => { if (vidaRival > 0 && estadoRival !== 'defensa') estadoRival = 'idle'; }, 300);
                    if (vidaRival <= 0) {
                        estadoRival = 'derrotado'; dibujarDerrotado('rival'); reproducirSonido('ko');
                        setTimeout(() => { ganarRound(); }, 2000);
                    }
                }, 100);
            }
            setTimeout(() => {
                cooldownAtaque = false;
                if (vidaRival > 0 && estadoJugador !== 'saltando' && estadoJugador !== 'defensa') estadoJugador = 'idle';
            }, duracion);
        }

        function atacarRival(tipo, daño, duracion) {
            estadoRival = tipo;
            reproducirSonido(tipo);
            const distancia = Math.abs(posXRival - posXJugador);
            if (distancia < 120) {
                setTimeout(() => {
                    let dañoFinal = daño;
                    if (estaDefendiendo) {
                        dañoFinal = daño * 0.2;
                        mostrarEfectoGolpe(posXJugador, 'BLOQ'); 
                        reproducirSonido('bloqueo');
                    } else {
                        estadoJugador = 'golpeado';
                        mostrarEfectoGolpe(posXJugador, tipo);
                    }
                    vidaJugador -= dañoFinal; actualizarBarrasVida();
                    setTimeout(() => { if (vidaJugador > 0 && !estaDefendiendo) estadoJugador = 'idle'; }, 300);
                    if (vidaJugador <= 0) {
                        estadoJugador = 'derrotado'; dibujarDerrotado('jugador'); reproducirSonido('ko');
                        setTimeout(() => { perderRound(); }, 2000);
                    }
                }, 100);
            }
            setTimeout(() => {
                if (vidaRival > 0 && estadoRival !== 'golpeado' && estadoRival !== 'derrotado' && estadoRival !== 'defensa') estadoRival = 'idle';
            }, duracion);
        }

        function ganarRound() {
            if (!juegoActivo) return;
            juegoActivo = false; 
            victoriasJugador++; 
            actualizarMarcador(); 
            reproducirSonido('victoria');
            
            timeoutGanarRound = setTimeout(() => {
                if (victoriasJugador >= 2) {
                    if (indiceRivalActual >= rivalesDisponibles.length - 1) {
                        mostrarResultadoFinal(true);
                    } else {
                        mostrarPantallaCombate(true);
                    }
                } else {
                    roundActual++;
                    iniciarRound();
                }
            }, 500);
        }

        function perderRound() {
            if (!juegoActivo) return;
            juegoActivo = false; 
            victoriasRival++; 
            actualizarMarcador(); 
            reproducirSonido('derrota');
            
            timeoutGanarRound = setTimeout(() => {
                if (victoriasRival >= 2) {
                    mostrarResultadoFinal(false);
                } else {
                    roundActual++;
                    iniciarRound();
                }
            }, 500);
        }

        function mostrarPantallaCombate(ganoCombate) {
            estadoJuego = 'round';
            const indicador = document.getElementById('modo-indicador');
            indicador.innerText = 'FIN DE COMBATE: Pulsa A para continuar';
            indicador.classList.remove('oculto');
            
            indiceRivalActual++;
            rivalNum = rivalesDisponibles[indiceRivalActual];
            rivalConfig = PERSONAJES[rivalNum];
            
            roundActual = 1;
            victoriasJugador = 0;
            victoriasRival = 0;
            
            const titulo = document.getElementById('round-titulo');
            const mensaje = document.getElementById('round-mensaje');
            titulo.innerText = '¡COMBATE GANADO!';
            titulo.style.color = '#0f0';
            mensaje.innerText = '¡Superaste a ' + PERSONAJES[rivalesDisponibles[indiceRivalActual - 1]].nombre + '!\n' + 
                                'Siguiente rival: ' + rivalConfig.nombre;
            document.getElementById('pantalla-round').classList.add('visible');
        }

        function siguienteRound() {
            vibrarBoton();
            document.getElementById('pantalla-round').classList.remove('visible');
            estadoJugador = 'idle'; estadoRival = 'idle';
            estaSaltando = false; estaDefendiendo = false; cooldownAtaque = false;
            iniciarRound();
        }

        function mostrarResultadoFinal(gano) {
            estadoJuego = 'final';
            const indicador = document.getElementById('modo-indicador');
            indicador.innerText = 'FIN DEL JUEGO: Pulsa A para reiniciar';
            indicador.classList.remove('oculto');
            
            document.getElementById('hud').classList.add('oculto');
            document.getElementById('jugador').classList.add('oculto');
            document.getElementById('rival').classList.add('oculto');
            const titulo = document.getElementById('resultado-final-titulo');
            const resultado = document.getElementById('resultado-final');
            if (gano) {
                titulo.innerText = '¡CAMPEÓN!'; titulo.style.color = '#0f0';
                resultado.innerHTML = '<p style="color: #0f0; font-size: 16px;">¡Derrotaste a todos los rivales!</p>' +
                    '<p style="color: #fff;">Incluidos Carapan, Ainhoa, Joaquín y Lia Dragón</p>' +
                    '<p style="color: #ff0;">¡Eres el campeón de CHONY GAMEBOY!</p>';
            } else {
                titulo.innerText = '¡GAME OVER!'; titulo.style.color = '#f00';
                resultado.innerHTML = '<p style="color: #f00; font-size: 16px;">Has sido derrotado</p>' +
                    '<p style="color: #fff;">No pudiste vencer a todos los rivales</p>' +
                    '<p style="color: #ff0;">Inténtalo de nuevo</p>';
            }
            document.getElementById('pantalla-final').classList.remove('oculto');
        }

        function actualizarMarcador() {
            for (let i = 1; i <= 3; i++) document.getElementById('v-j' + i).classList.remove('ganada');
            for (let i = 1; i <= victoriasJugador; i++) document.getElementById('v-j' + i).classList.add('ganada');
        }

        function mostrarEfectoGolpe(x, tipo) {
            const efecto = document.createElement('div');
            efecto.className = 'efecto-golpe';
            if (tipo === 'puñetazo') efecto.innerText = 'POW!';
            else if (tipo === 'patada') efecto.innerText = 'BAM!';
            else if (tipo === 'especial') efecto.innerText = 'BOOM!';
            else efecto.innerText = 'BLOQ!';
            efecto.style.left = x + 'px'; efecto.style.bottom = '40%';
            document.getElementById('juego').appendChild(efecto);
            setTimeout(() => efecto.remove(), 500);
        }

        function mostrarAnuncio(texto) {
            const anuncio = document.createElement('div');
            anuncio.id = 'anuncio'; anuncio.innerText = texto;
            document.getElementById('juego').appendChild(anuncio);
            setTimeout(() => anuncio.remove(), 2000);
        }

        function actualizarBarrasVida() {
            document.getElementById('vida-jugador').style.width = Math.max(0, (vidaJugador / jugadorConfig.vida) * 100) + '%';
            document.getElementById('vida-rival').style.width = Math.max(0, (vidaRival / vidaRivalMax) * 100) + '%';
        }

        actualizarSeleccionMenu();
        cargarSpriteSheets().then(() => {
            console.log('✅ Spritesheets cargados:', Object.keys(spriteSheets).length, 'personajes');
        }).catch((e) => {
            console.error('❌ Error cargando spritesheets:', e);
        });
    </script>
</body>
</html>
